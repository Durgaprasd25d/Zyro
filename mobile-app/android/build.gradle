// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
        classpath 'com.google.gms:google-services:4.4.1'
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
    maven {
      url 'https://api.mapbox.com/downloads/v2/releases/maven'
      authentication {
        basic(BasicAuthentication)
      }
      credentials {
        // Do not change the username ==> 'mapbox' is correct
        username = 'mapbox'
        // Use the secret token you stored in gradle.properties as the password
        password = project.findProperty('MAPBOX_DOWNLOADS_TOKEN') ?: ""
      }
    }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"

subprojects {
    configurations.all {
        resolutionStrategy {
            dependencySubstitution {
                substitute module('com.mapbox.maps:android') using module('com.mapbox.maps:android-ndk27:11.23.1')
                substitute module('com.mapbox.maps:base') using module('com.mapbox.maps:base-ndk27:11.23.1')
                substitute module('com.mapbox.common:common') using module('com.mapbox.common:common-ndk27:24.23.1')
                substitute module('com.mapbox.module:maps-telemetry') using module('com.mapbox.module:maps-telemetry-ndk27:11.23.1')
            }
            eachDependency { details ->
                if (details.requested.group == 'org.jetbrains.kotlinx' && details.requested.name == 'kotlinx-coroutines-play-services') {
                    details.useVersion("1.9.0")
                }
            }
        }
    }
}
