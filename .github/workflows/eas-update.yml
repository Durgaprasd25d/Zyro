name: EAS Air Push (OTA Update)

on:
  push:
    branches:
      - main
    paths:
      - 'mobile-app/**'
      - '.github/workflows/eas-update.yml'
  workflow_dispatch:
    inputs:
      channel:
        description: 'EAS Channel to update (production / staging)'
        required: true
        default: 'production'
      message:
        description: 'Update message'
        required: false
        default: 'Manual OTA update triggered from GitHub'

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

jobs:
  publish-update:
    name: Publish EAS OTA Update
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📱 Setup EAS CLI
        run: npm install -g eas-cli

      - name: 📦 Install Dependencies
        working-directory: mobile-app
        run: npm install

      - name: 🚀 Publish Air Push (Push to main)
        if: github.event_name == 'push'
        working-directory: mobile-app
        run: |
          eas update --channel production --message "${{ github.event.head_commit.message }}" --non-interactive

      - name: 🚀 Publish Air Push (Manual Dispatch)
        if: github.event_name == 'workflow_dispatch'
        working-directory: mobile-app
        run: |
          eas update --channel ${{ github.event.inputs.channel }} --message "${{ github.event.inputs.message }}" --non-interactive
